name: smartguardian
description: Smart Guardian safety monitoring app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.4

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2

  # Sensors (accelerometer for fall detection simulation)
  sensors_plus: ^6.1.0

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Utilities
  uuid: ^4.1.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
